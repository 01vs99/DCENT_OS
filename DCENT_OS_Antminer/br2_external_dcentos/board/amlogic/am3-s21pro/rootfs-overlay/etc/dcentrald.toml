# DCENT_OS exact S21 Pro Amlogic BM1370 hardware beta.
# Held production model -> ASIC profile -> PsuAsVoltageController selects
# the retained AML GPIO APW17/c1 owner; factory PIC presence does not imply
# a PIC-managed AML software route. Exact board names A3HB70601/70602, 65 chips/chain.
# Physical slots 1/2/3 bind ttyS3/ttyS2/ttyS1 after fresh board/population checks.
# Configure a pool and select Start Mining; the image boots idle.

[general]
hostname = "dcent-s21pro"
log_level = "info"

[pool]
url = ""
worker = ""
password = "x"
protocol = "sv1"

[mining]
enabled = false
model = "s21pro"
# BM1370 sweet-spot cold-boot defaults (bm1370.rs Step -2). The autotuner ramps
# toward nameplate (Step 0: 525 MHz / 13.8 V / 234 TH/s) when opted in.
frequency_mhz = 480
voltage_mv = 13400
version_rolling = true
passthrough = false
suggest_difficulty = 8192
serial_device = "/dev/ttyS2"
# PER-CHAIN chip count, not the unit total. A standard S21 Pro is 3 hashboards
# x 65 BM1370 = 195 chips total (bitaxeGamma readme; mujina PROTOCOL.md "65x
# BM1370"; BM1373_S23_RESEARCH.md "Chips/chain | 65"; model.rs s21pro
# chips_per_chain_hint = 65). This field previously held 195, the unit total,
# which outranked the 65 model hint and made assigned-geometry validation fail
# — but only AFTER the rail was already energized.
serial_chip_count = 65
serial_chip_type = "BM1370"

[power]
mode = "bypass"
target_watts = 3000

[thermal]
target_temp_c = 60
hot_temp_c = 70
dangerous_temp_c = 80
fan_min_pwm = 10
fan_max_pwm = 30

[api]
# Read-only LAN monitoring; remote control requires a separate explicit opt-in.
cgminer_bind_lan = true
cgminer_lan_writes = false
cgminer_port = 4028
http_port = 8080
websocket = true
auth_enabled = false
auth_password = ""

[donation]
# DCENT_OS ships with ZERO mandatory fee. Optional transparent donation:
# set enabled = true and percent 1-5 (time-sliced, always visible, one tap
# off). Fund development: https://d-central.tech/fund/
enabled = false
percent = 0.0
pool_url = ""
worker = ""
password = "x"
cycle_duration_s = 3600

[watchdog]
# Autonomous crash-recovery for the NoPic Amlogic family. Unlike am2/S9 there is
# NO PIC/dsPIC hardware heartbeat backstop, so a silent (non-panicking) daemon
# hang would otherwise leave the boards energized indefinitely (thermal risk on a
# home space heater). The kicker opens /dev/watchdog AFTER hardware init (the
# bring-up window can't trip it) and degrades gracefully (warns + continues) if
# the SoC watchdog is unavailable or the timeout can't be set. Matches the proven
# zynq/am1 production config; restores the struct default (enabled=true) these
# overlays previously overrode.
enabled = true
timeout_s = 30
kick_interval_s = 5

[hash_on_disconnect]
enabled = true

[mode]
active = "standard"

[autotuner]
# Autotune is ON by default (operator decision 2026-09-01). Safety contract:
# the tuner REFUSES to tune blind - every frequency/voltage step validates
# against the variant BoardDesc cut-ladder + published envelope BEFORE
# execution; variants with unknown/missing envelope datums surface
# NOT TUNABLE instead of tuning. First boot parks at the safe-stock
# profile until health + fans + temp-in-envelope (+ ExperimentalOptIn
# operator ack) pass. Voltage autotune on am2 stays behind the
# DCENT_AM2_VOLTAGE_AUTOTUNE live-safety fence.
enabled = true
min_freq_mhz = 400
max_freq_mhz = 585

[led]
enabled = true
heartbeat_on_ms = 100
heartbeat_off_ms = 900
