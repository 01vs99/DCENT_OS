# Exact R10 classic S19j Pro AML native BM1362 image; boots idle for pool setup.
# BHB42601/21/41, 126 ASICs per selected board. Current-boot retained factory
# identity admits only the classic application firmware 0x89. Adjacent A/Plus,
# NoPic and generic PIC1704 controller paths do not own this runtime.
# Source-backed software integration; physical qualification remains pending.
# /data/dcentrald.toml overrides this file and survives supported updates.

[general]
hostname = "dcentos-s19jpro-aml"
log_level = "info"

[mining]
enabled = false
frequency_mhz = 400
voltage_mv = 13700
model = "s19jpro"
serial_chip_count = 126
serial_chip_type = "BM1362"
suggest_difficulty = 8192
passthrough = false
version_rolling = true

[platform]
target = "am3-aml-s19jpro"
board_target = "am3-s19jpro-aml"

[pool]
url = ""
worker = ""
password = "d=1"

[thermal]
target_temp_c = 60
hot_temp_c = 70
dangerous_temp_c = 80
# Fixed quiet PWM30, four observed tach channels and all selected PIC LM75s.
# Stale or failed supervision cuts GPIO437 raw-high before parser cleanup.
fan_max_pwm = 30
fan_min_pwm = 10

[psu]
# Retained classic APW12 application versions75..77, bit-banged GPIO477/476.
# Exact voltage ADC confirmation comes from each selected fw89 PIC.
model = "APW12"
power_target_w = 3000
power_step_w = 300
hashrate_target_ths = 100.0
hashrate_step_ths = 5.0

[hashboard]
# Protected bus1 factory pages at0x50..0x52 remain write-denied. The native
# owner requires complete repeatable CRC-valid BHB42601/21/41 records.
eeprom_parser = "bhb42"

[api]
cgminer_port = 4028
http_port = 8080
websocket = true
cgminer_bind_lan = true
# API-1 (security): allow MUTATING CGMiner/LuxOS verbs (addpool/switchpool/
# config changes) from NON-loopback LAN peers. DEFAULT false (fail-closed):
# even with cgminer_bind_lan=true, remote mutating verbs stay blocked unless
# this is ALSO true (loopback writes always work). Set true ONLY on a trusted LAN.
cgminer_lan_writes = false
metrics_require_auth = true

[donation]
# DCENT_OS ships with ZERO mandatory fee. Optional transparent donation:
# set enabled = true and percent 1-5 (time-sliced, always visible, one tap
# off). Fund development: https://d-central.tech/fund/
enabled = false
percent = 0.0
pool_url = "stratum+tcp://pool.d-central.tech:3333"
worker = "DungeonMaster"
password = "x"
fallback_enabled = true
fallback_pool_url = "stratum+tcp://stratum.braiins.com:3333"
fallback_worker = "DungeonMaster"
fallback_password = "x"
cycle_duration_s = 3600

[watchdog]
# Hardware watchdog must arm before power admission; unavailable watchdogs
# refuse mining. The same route owns heartbeat, thermal, serial and API cutoff
# and keeps feeding terminally closed on incomplete cleanup.
enabled = true
timeout_s = 40
kick_interval_s = 5

[hash_on_disconnect]
enabled = false

[mode]
# Quiet home mode; the classic native runtime fixes fans at PWM30.
active = "home"

[led]
enabled = true
heartbeat_on_ms = 100
heartbeat_off_ms = 900
locate_pattern = "imperial_march"
locate_duration_s = 30
flash_on_accepted_share = true
flash_on_rejected_share = true
night_mode_disable = false
celebration_on_lucky_share = true
chain_status_blink_codes = true

[autotuner]
# Preserve the operator's enabled preference. This classic native lifecycle
# currently exposes a read-only API and uses the selected fixed400..500MHz
# profile; it does not yet launch an autotuner or admit generic rail mutations.
enabled = true
preset = "balanced_home"
