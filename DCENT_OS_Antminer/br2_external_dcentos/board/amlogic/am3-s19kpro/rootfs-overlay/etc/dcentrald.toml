# DCENT_OS Mining Daemon Configuration — Antminer S19K Pro NoPic (am3-aml)
# D-Central Technologies — Phase H baseline
#
# Baked baseline for am3-aml-s19k (Amlogic A113D, BM1366 NoPic, 3 chains × 77 chips).
# Aligns with dcentrald/dcentrald_s19k.toml for host-driven /tmp trial (Bench HOLD).
# Identity markers: /etc/dcentos/board_target=am3-s19k (plus typed toml [platform]).
# Values are sourced from the lab-unit live capture of /etc/bosminer_model.json
# (held reference corpus
# bosminer_model.json) but tightened to D-Central home-mining defaults:
#   - mining disabled by default (operator opts in post-flash)
#   - thermal envelope below industrial extremes (75/88 hot/dangerous)
#   - fan_max_pwm = 30 ( B3 — home-mining default, matches S21 overlay)
#   - [mode] active = "home" (matches the conservative thermal envelope)
#   - rambo_mode_max_bad_responses = 0 (via /etc/dcentrald-experimental.toml)
#
# Override order: /data/dcentrald.toml > /etc/dcentrald.toml
# Persistent custom config goes in /data/ (survives firmware updates).

[general]
hostname = "dcentos-s19kpro"
log_level = "info"

[mining]
enabled = false
# Schema-valid identity (serial_*); topology chains=3 lives in BoardDesc/HAL.
serial_chip_type = "BM1366"
serial_chip_count = 77
frequency_mhz = 670
voltage_mv = 13900
model = "s19k"
suggest_difficulty = 8192
passthrough = false
version_rolling = true
# /tmp trial + host dcentrald_s19k.toml serial path (pick populated slot).
serial_device = "/dev/ttyS2"

# Identity is via /etc/dcentos/board_target (content am3-s19k) and
# /etc/dcentos/platform (am3-aml-s19k) — plus typed toml [platform].

# Typed [platform] identity for /tmp trials (target + board_target only — no
# safety flags). Runtime prefers /etc/dcentos/{platform,board_target} when
# present; config fills gaps. Unknown [platform] keys fail closed. CE #1 banned
# phantom kitchen-sink flags, not this typed identity section.
# Trial helper also stages /etc/dcentos/board_target=am3-s19k and
# /etc/dcentos/platform=am3-aml-s19k (authoritative when present).

[platform]
target = "am3-aml-s19k"
board_target = "am3-s19k"

[pool]
url = ""
worker = ""
password = "d=1"

[thermal]
target_temp_c = 65
hot_temp_c = 75
dangerous_temp_c = 88
#  B3: home-mining default. Industrial users opt-in via [mode].
fan_max_pwm = 30
fan_min_pwm = 10

[psu]
model = "APW121215f"
power_target_w = 754
power_step_w = 300
hashrate_target_ths = 120.0
hashrate_step_ths = 11.0

[hashboard]
eeprom_parser = "x21_aes"
decoded_reference_file = "/etc/dcentos/hashboard_decoded.json"

# [experimental] is NOT part of DcentraldConfig — load via /etc/dcentrald-experimental.toml

[api]
cgminer_port = 4028
http_port = 8080
websocket = true
cgminer_bind_lan = true
cgminer_lan_writes = false
metrics_require_auth = true

[donation]
# DCENT_OS ships with ZERO mandatory fee. Optional transparent donation:
# set enabled = true and percent 1-5 (time-sliced, always visible, one tap
# off). Fund development: https://d-central.tech/fund/
enabled = false
percent = 0.0
pool_url = "stratum+tcp://pool.d-central.tech:3333"
worker = "DungeonMaster"
password = "x"
fallback_enabled = true
fallback_pool_url = "stratum+tcp://stratum.braiins.com:3333"
fallback_worker = "DungeonMaster"
fallback_password = "x"
cycle_duration_s = 3600

[watchdog]
enabled = true
timeout_s = 30
kick_interval_s = 5

[hash_on_disconnect]
enabled = true

[mode]
active = "home"

[led]
enabled = true
heartbeat_on_ms = 100
heartbeat_off_ms = 900
locate_pattern = "imperial_march"
locate_duration_s = 30
flash_on_accepted_share = true
flash_on_rejected_share = true
night_mode_disable = false
celebration_on_lucky_share = true
chain_status_blink_codes = true

[autotuner]
# Autotune is ON by default (operator decision 2026-09-01). Safety contract:
# the tuner REFUSES to tune blind - every frequency/voltage step validates
# against the variant BoardDesc cut-ladder + published envelope BEFORE
# execution; variants with unknown/missing envelope datums surface
# NOT TUNABLE instead of tuning. First boot parks at the safe-stock
# profile until health + fans + temp-in-envelope (+ ExperimentalOptIn
# operator ack) pass. Voltage autotune on am2 stays behind the
# DCENT_AM2_VOLTAGE_AUTOTUNE live-safety fence.
enabled = true
preset = "balanced_home"
