# DCENT_OS dcentrald config — Antminer T21 Amlogic (am3-aml-t21)
# D-Central Technologies — Phase 4B scaffold (2026-05-15)
#
# This is a disabled Amlogic T21 packaging scaffold. Held stock firmware proves
# Amlogic, Zynq7007, and CV controller variants for the BHB6870X family.
#
# Stock-contract reconciliation (Gauntlet B9, 2026-09-02): Bitmain's own
# t21-merge-20240926 image (BMU sha256 f9dcf13a...) settles the hashboard
# contracts first-party: BM1368, three 108-chip chains (12 domains x 9,
# interval 2), PSU APW11A @ I2C 0x10 gpio 907, per-chain voltage-MCU label
# PIC1704 @ 0x20 + AT24C02D EEPROM @ 0x50, four fans. Pinned in
# dcentrald-silicon-profiles/src/t21_stock_topol.rs (every datum cited).
# The AML control-board record in the same image is SEALED (code-9 ANDROID),
# so Amlogic-side GPIO/storage/cold-init contracts remain unresolved.
#
# Platform identity:
#   /etc/dcentos-platform           = am3-aml-t21
#   /etc/dcentos/board_family       = am3
#   /etc/dcentos/board_target       = am3-t21
#
# Status: NO LIVE UNIT yet. Mining is disabled and runtime admission is
# management-only. S21 NoPic/TAS5782M behavior is not T21 evidence and must not
# authorize voltage or rail control for this target.
#
# Override order: /data/dcentrald.toml > /etc/dcentrald.toml. Operator
# customizations belong in /data/ (survives sysupgrade).

[general]
hostname = "dcentos-t21"
log_level = "info"

[mining]
enabled = false
# These are schema-valid desk-evidence hints, not release-authoritative
# geometry. The stock topol (BHB68701/03/05, byte-identical except names)
# settles 108 chips per chain first-party (t21_stock_topol). Stock levels
# ladder for reference: 600 MHz / 350 MHz (opaque voltage tokens 1550/1300
# — unit NOT established; 525/13550 below are inert scaffold hints, not
# stock values). Runtime admission stays management-only pending a live
# unit; the native-serial resolver still refuses t21 (controller
# contradiction flagged, not adjudicated).
serial_chip_type = "BM1368"
serial_chip_count = 108
frequency_mhz = 525
voltage_mv = 13550
model = "t21"
suggest_difficulty = 8192
passthrough = false
version_rolling = true

[platform]
target = "am3-aml-t21"
board_target = "am3-t21"

[pool]
url = ""
worker = ""
password = "d=1"

[thermal]
target_temp_c = 60
hot_temp_c = 70
dangerous_temp_c = 80
fan_max_pwm = 30
fan_min_pwm = 10

[psu]
# Inactive while mining is disabled. PSU identity CORRECTED on stock evidence
# (B9, 2026-09-02): the T21 stock topol states APW11A @ I2C 0x10 gpio 907
# (version keys 66/67/106/113/114/115/117/118/119/120/193; stock probes the
# PSU version then falls back to a v2 protocol) — the earlier APW12 label
# was an S21-derived placeholder, flagged as a conflict in the B9 dossier.
# No APW11A rail-law constant is extracted (K1/K2 class): bench/Ghidra
# follow-up; this section authorizes nothing.
model = "APW11A"
power_target_w = 1500
power_step_w = 300
hashrate_target_ths = 60.0
hashrate_step_ths = 5.0

[power]
mode = "bypass"
target_watts = 1500

[power.psu_override]
enabled = false
# Same stock correction as [psu]: APW11A per the t21-merge topol. Override
# stays disabled and authorizes nothing.
model = "APW11A"
voltage_v = 14.0

[hashboard]
# No parser family is claimed. T21 board identities: BHB68701/03/05 (one
# contract family — stock records byte-identical except names). Stock pins
# the hashboard-side map (PIC1704 label @ 0x20, AT24C02D EEPROM @ 0x50,
# LM75A @ 0x48-0x4B) but a label is not a populated-part proof and the AML
# control board is sealed; mining stays disabled.
eeprom_parser = "auto"

[api]
cgminer_port = 4028
http_port = 8080
websocket = true
cgminer_bind_lan = false
# API-1 (security): allow MUTATING CGMiner/LuxOS verbs (addpool/switchpool/
# config changes) from NON-loopback LAN peers. DEFAULT false (fail-closed):
# even with cgminer_bind_lan=true, remote mutating verbs stay blocked unless
# this is ALSO true (loopback writes always work). Set true ONLY on a trusted LAN.
cgminer_lan_writes = false
metrics_require_auth = true

[donation]
# DCENT_OS ships with ZERO mandatory fee. Optional transparent donation:
# set enabled = true and percent 1-5 (time-sliced, always visible, one tap
# off). Fund development: https://d-central.tech/fund/
enabled = false
percent = 0.0
pool_url = "stratum+tcp://pool.d-central.tech:3333"
worker = "DungeonMaster"
password = "x"
fallback_enabled = true
fallback_pool_url = "stratum+tcp://stratum.braiins.com:3333"
fallback_worker = "DungeonMaster"
fallback_password = "x"
cycle_duration_s = 3600

[watchdog]
# Autonomous crash-recovery for the Amlogic scaffold. No T21 PIC/dsPIC
# heartbeat contract is proven, so software must not assume a hardware backstop.
# The kicker opens /dev/watchdog AFTER hardware init (the
# bring-up window can't trip it) and degrades gracefully (warns + continues) if
# the SoC watchdog is unavailable or the timeout can't be set. Matches the proven
# zynq/am1 production config; restores the struct default (enabled=true) these
# overlays previously overrode.
enabled = true
timeout_s = 30
kick_interval_s = 5

[hash_on_disconnect]
enabled = true

[mode]
active = "home"

[autotuner]
# Autotune is ON by default (operator decision 2026-09-01). Safety contract:
# the tuner REFUSES to tune blind - every frequency/voltage step validates
# against the variant BoardDesc cut-ladder + published envelope BEFORE
# execution; variants with unknown/missing envelope datums surface
# NOT TUNABLE instead of tuning. First boot parks at the safe-stock
# profile until health + fans + temp-in-envelope (+ ExperimentalOptIn
# operator ack) pass. Voltage autotune on am2 stays behind the
# DCENT_AM2_VOLTAGE_AUTOTUNE live-safety fence.
enabled = true
min_freq_mhz = 200
max_freq_mhz = 500

[led]
enabled = true
heartbeat_on_ms = 100
heartbeat_off_ms = 900
locate_pattern = "imperial_march"
locate_duration_s = 30
flash_on_accepted_share = true
flash_on_rejected_share = true
night_mode_disable = false
celebration_on_lucky_share = true
chain_status_blink_codes = true
