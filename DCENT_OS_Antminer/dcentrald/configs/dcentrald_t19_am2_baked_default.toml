# Exact AM2 t19 / NBT1903 BM1398 native defaults.
# Configure a pool and press Start; mining and autotuning start disabled.
# Operating point comes from this model's own held stock levels.json.
# Signed image/route, decoded exact EEPROM names on every connected slot,
# PIC1704 app0x89, APW12 version0x71, observed GPIO/FPGA/clock identity,
# complete chip coverage and continuous four-fan/temperature custody remain required.
# The native owner uses the mining rail below; the generic PSU transport
# fields do not select its retained PIC/PSU protocol. PWM never exceeds30.
# No claim of physical cold-boot, measured polarity or rated hashrate.

[general]
hostname = "dcentos-t19"
log_level = "info"

[pool]
url = ""
worker = ""
password = "x"
protocol = "sv1"

[mining]
enabled = false

voltage_mv = 14200

frequency_mhz = 550
am2_pll_ramp = false

am2_no_nonce_timeout_s = 90

suggest_difficulty = 256

passthrough = false

version_rolling = false

serial_device = "/dev/ttyS1"
serial_chip_count = 76
serial_chip_type = "BM1398"

fpga_chain_base = "0x43C00000"
fpga_chain_id = 1

model = "t19"

skip_fifo_reset = false
skip_board_temp = false

[power]
psu_bypass = false

max_watts = 1200

circuit_capacity_watts = 4800
circuit_voltage_v = 240
circuit_amperage_a = 20

[power.psu_override]
enabled = false
model = "APW3"
voltage_v = 14.20

[psu]
voltage_mv = 14200
heartbeat_hz = 1
watchdog_enabled = true
i2c_address = 0x10
transport = "gpio_bitbang"
pwr_control_gpio = "gpio:907"

[thermal]
target_temp_c = 60
hot_temp_c = 70
dangerous_temp_c = 80

fan_min_pwm = 10
fan_max_pwm = 30

pid_interval_s = 2.0
hysteresis_c = 3

[thermal.supervisor]
enabled = true
min_fans = 3

[api]
cgminer_port = 4028
http_port = 8080
websocket = true
cgminer_bind_lan = true
cgminer_lan_writes = false
metrics_require_auth = true

[donation]
enabled = false
percent = 0.0
pool_url = "stratum+tcp://pool.d-central.tech:3333"
worker = "DungeonMaster"
password = "x"
fallback_enabled = true
fallback_pool_url = "stratum+tcp://stratum.braiins.com:3333"
fallback_worker = "DungeonMaster"
fallback_password = "x"
cycle_duration_s = 3600

[watchdog]
enabled = true
kick_interval_s = 5

[hash_on_disconnect]
enabled = false

[mode]
active = "standard"

[autotuner]
enabled = false

[led]
enabled = true
heartbeat_on_ms = 100
heartbeat_off_ms = 900
flash_on_accepted_share = true
flash_on_rejected_share = true
