# DCENT_OS hardware beta default: AM2 S17 / S17 Pro (BM1397).
# The SD builder changes model and chip count for S17+ / T17 / T17+.
# All four use BM1397; S17e / T17e use BM1396 and are separate targets.
#
# This image starts idle. Configure a pool and enable mining to start the
# exact-target native runtime. Its beta admission policy is baked separately
# into /etc/dcentrald-experimental.toml; no environment opt-in is required.
#
# Native startup reads each protected EEPROM twice, checks fixture and
# production CRCs, identifies the board and PIC application, and selects the
# lowest common factory voltage mode. The 100 MHz initial PLL and factory
# voltage are enforced by s17_native_runtime; the legacy voltage/PSU config
# fields below do not override that owner. APW9 uses framed I2C bus 1 @ 0x10.
# Startup also checks the boot-owned bitstream receipt, observed fabric clock,
# chip coverage, all four fans and TMP451 (or plus-family NCT218) calibration.
#
# The native owner limits fan PWM to 30 and temperature to 80 C, waits for five
# stable PIC heartbeats before voltage, and performs checked power-off plus
# reset assertion on exit. Failed closeout retains the hardware watchdog.
# Protected EEPROM writes and PIC reset/jump/erase remain unavailable.
#
# Desk tests cover protocol execution and independently valid work/nonces.
# Physical cold boot, electrical behavior and sustained pool shares still
# require qualification on each variant. This is not a rated-hashrate profile.
# Autotuning, PSU bypass and stale-work hashing stay disabled.
# /data/dcentrald.toml takes precedence for persistent pool/start settings.

[general]
hostname = "dcentos-s17pro"
log_level = "info"

[pool]
url = ""
worker = ""
password = "x"
protocol = "sv1"

[mining]
enabled = false

voltage_mv = 13700

frequency_mhz = 100
am2_pll_ramp = false

am2_no_nonce_timeout_s = 90

suggest_difficulty = 256

passthrough = false

version_rolling = false

serial_device = "/dev/ttyS1"
serial_chip_count = 48
serial_chip_type = "BM1397"

fpga_chain_base = "0x43C00000"
fpga_chain_id = 1

model = "s17pro"

skip_fifo_reset = false
skip_board_temp = false

[power]
psu_bypass = false

max_watts = 1200

circuit_capacity_watts = 4800
circuit_voltage_v = 240
circuit_amperage_a = 20

[power.psu_override]
enabled = false
model = "APW3"
voltage_v = 12.8

[psu]
voltage_mv = 15200
heartbeat_hz = 1
watchdog_enabled = true
i2c_address = 0x10
transport = "gpio_bitbang"
pwr_control_gpio = "gpio:907"

[thermal]
target_temp_c = 60
hot_temp_c = 70
dangerous_temp_c = 80

fan_min_pwm = 10
fan_max_pwm = 30

pid_interval_s = 2.0
hysteresis_c = 3

[thermal.supervisor]
enabled = true
min_fans = 3

[api]
cgminer_port = 4028
http_port = 8080
websocket = true
cgminer_bind_lan = true
cgminer_lan_writes = false
metrics_require_auth = true

[donation]
enabled = false
percent = 0.0
pool_url = "stratum+tcp://pool.d-central.tech:3333"
worker = "DungeonMaster"
password = "x"
fallback_enabled = true
fallback_pool_url = "stratum+tcp://stratum.braiins.com:3333"
fallback_worker = "DungeonMaster"
fallback_password = "x"
cycle_duration_s = 3600

[watchdog]
enabled = true
kick_interval_s = 5

[hash_on_disconnect]
enabled = false

[mode]
active = "standard"

[autotuner]
enabled = false

[led]
enabled = true
heartbeat_on_ms = 100
heartbeat_off_ms = 900
flash_on_accepted_share = true
flash_on_rejected_share = true
