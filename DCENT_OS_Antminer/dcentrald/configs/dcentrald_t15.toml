# DCENT_OS runtime template for Antminer T15 (BM1391).
# Unsupported scaffold: host-parse only; mining stays disabled until BP-S15-BRINGUP.

[general]
hostname = "dcentos-t15"
log_level = "info"

[pool]
url = ""
worker = ""
password = "x"
protocol = "sv1"

[mining]
enabled = false
model = "t15"
# Exact T15 geometry, setpoints, and controller endpoint are unheld.
frequency_mhz = 0
voltage_mv = 0
version_rolling = false
passthrough = false
suggest_difficulty = 256
serial_chip_type = "BM1391"

[power]
mode = "bypass"
target_watts = 0

[thermal]
target_temp_c = 60
hot_temp_c = 70
dangerous_temp_c = 80
fan_min_pwm = 10
fan_max_pwm = 30

[api]
cgminer_port = 4028
http_port = 8080
websocket = true

[donation]
# DCENT_OS ships 0% by default; percent only matters when opted in.
enabled = false
percent = 0.0
pool_url = ""
worker = ""
password = "x"
cycle_duration_s = 3600

[watchdog]
enabled = true

[hash_on_disconnect]
enabled = false

[mode]
active = "standard"

[autotuner]
enabled = false

[led]
enabled = true
heartbeat_on_ms = 100
heartbeat_off_ms = 900
