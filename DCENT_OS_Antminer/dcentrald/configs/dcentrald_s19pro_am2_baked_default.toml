# DCENT_OS hardware beta default: AM2 S19 Pro / BM1398 / NBP1901.
# Configure a pool and enable mining after this idle-first image boots.
# The image includes exact am2-s19pro / BM1398 experimental admission.
#
# The native owner requires exact EEPROM identity, loaded-fabric evidence,
# complete chip coverage and stock NBP1901 PIC firmware before hashing.
# 12800 mV is one of the held NBP1901 production voltage modes (12600,
# 12800, 13000). The owner uses PIC16F1704 firmware 0x89 and the stock APW
# protocol; it does not borrow the S19j dsPIC cold-init path.
# The legacy [psu] block below is not the native owner's transport selection.
#
# The owner continuously checks all four fans and board temperatures,
# limits fan PWM to 30 and temperature to 80 C, and requires checked power
# and PIC voltage-off before hardware-watchdog closeout. The separate
# generic thermal.supervisor flag does not disable native supervision.
# EEPROM writes, PIC reset/jump/erase and PSU bypass remain unavailable.
#
# Desk protocol/work tests are not physical cold-boot or rated-hashrate proof.
# Autotuning and stale-work hashing are disabled for this beta profile.
# /data/dcentrald.toml takes precedence for persistent pool/start settings.

[general]
hostname = "dcentos-s19pro"
log_level = "info"

[pool]
url = ""
worker = ""
password = "x"
protocol = "sv1"

[mining]
enabled = false

voltage_mv = 12800

frequency_mhz = 500
am2_pll_ramp = false

am2_no_nonce_timeout_s = 90

suggest_difficulty = 256

passthrough = false

version_rolling = false

serial_device = "/dev/ttyS1"
serial_chip_count = 114
serial_chip_type = "BM1398"

fpga_chain_base = "0x43C00000"
fpga_chain_id = 1

model = "s19pro"

skip_fifo_reset = false
skip_board_temp = false

[power]
psu_bypass = false

max_watts = 1200

circuit_capacity_watts = 4800
circuit_voltage_v = 240
circuit_amperage_a = 20

[power.psu_override]
enabled = false
model = "APW3"
voltage_v = 12.8

[psu]
voltage_mv = 15200
heartbeat_hz = 1
watchdog_enabled = true
i2c_address = 0x10
transport = "gpio_bitbang"
pwr_control_gpio = "gpio:907"

[thermal]
target_temp_c = 60
hot_temp_c = 70
dangerous_temp_c = 80

fan_min_pwm = 10
fan_max_pwm = 30

pid_interval_s = 2.0
hysteresis_c = 3

[thermal.supervisor]
enabled = true
min_fans = 3

[api]
cgminer_port = 4028
http_port = 8080
websocket = true
cgminer_bind_lan = true
cgminer_lan_writes = false
metrics_require_auth = true

[donation]
enabled = false
percent = 0.0
pool_url = "stratum+tcp://pool.d-central.tech:3333"
worker = "DungeonMaster"
password = "x"
fallback_enabled = true
fallback_pool_url = "stratum+tcp://stratum.braiins.com:3333"
fallback_worker = "DungeonMaster"
fallback_password = "x"
cycle_duration_s = 3600

[watchdog]
enabled = true
kick_interval_s = 5

[hash_on_disconnect]
enabled = false

[mode]
active = "standard"

[autotuner]
enabled = false

[led]
enabled = true
heartbeat_on_ms = 100
heartbeat_off_ms = 900
flash_on_accepted_share = true
flash_on_rejected_share = true
