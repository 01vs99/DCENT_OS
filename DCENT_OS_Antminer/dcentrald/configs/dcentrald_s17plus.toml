# DCENT_OS runtime template for Antminer S17+.
#
# 2026-08-03 mapping correction (W8-G): the S17+ carries BM1397 (0x1397), not
# BM1396 — the "e" variants (S17e/T17e) are the BM1396 parts. The catalog data
# has been corrected repo-wide.
#
# `serial_chip_type` is now "BM1397" too. Operator decision 2026-08-03 promoted
# these boards from fail-closed-on-an-unregistered-chip to Experimental dispatch
# on the REGISTERED BM1397 driver — the same driver S17 / S17 Pro / T17 already
# use, because it is the same silicon. [mining] stays enabled = false: this is
# still a management-only template and there is no S17+/T17+ unit on the fleet,
# so this is implemented-and-instrumented, NOT bench-proven. Chip COUNT is the
# part that differs from S17 (65 per chain here, not 48) — do not "align" it.

[general]
hostname = "dcentos-s17plus"
log_level = "info"

[pool]
url = ""
worker = ""
password = "x"
protocol = "sv1"

[mining]
enabled = false
model = "s17+"
frequency_mhz = 500
voltage_mv = 12000
version_rolling = false
passthrough = false
suggest_difficulty = 256
serial_device = "/dev/ttyS1"
serial_chip_count = 65
serial_chip_type = "BM1397"
am2_no_nonce_timeout_s = 90

[power]
mode = "bypass"
target_watts = 1000

[power.psu_override]
enabled = false
model = "APW3"
voltage_v = 12.8

[thermal]
target_temp_c = 60
hot_temp_c = 70
dangerous_temp_c = 80
fan_min_pwm = 10
fan_max_pwm = 30

[thermal.supervisor]
enabled = true
min_fans = 3

[api]
cgminer_port = 4028
http_port = 8080
websocket = true

[donation]
# DCENT_OS ships 0% by default; percent only matters when opted in.
enabled = false
percent = 0.0
pool_url = ""
worker = ""
password = "x"
cycle_duration_s = 3600

[watchdog]
enabled = true

[hash_on_disconnect]
enabled = false

[mode]
active = "standard"

[autotuner]
enabled = false

[led]
enabled = true
heartbeat_on_ms = 100
heartbeat_off_ms = 900
