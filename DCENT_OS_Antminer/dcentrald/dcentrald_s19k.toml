# DCENT_OS dcentrald config for Antminer S19k Pro (BM1366 family)
# Initial warm-init validation template for Amlogic-style serial mining.
# Adjust serial_device and pool settings before use.

[general]
hostname = "dcent-s19k"
log_level = "info"

[pool]
url = ""
worker = ""
password = "x"
protocol = "sv1"

[mining]
enabled = false
model = "s19k"
frequency_mhz = 400
voltage_mv = 12800
version_rolling = true
passthrough = false
suggest_difficulty = 8192

# Pick the ttyS device for the populated board on the target unit.
serial_device = "/dev/ttyS2"
serial_chip_count = 77
serial_chip_type = "BM1366"

# /tmp trial alignment with am3-s19kpro overlay identity (Bench HOLD).
# Near-term beta transport: Braiins (SSH) /tmp copy. Stock Bitmain first-install
# is separate — this config must stay valid for both; do not bake Braiins-only
# assumptions into stock restore/install code.
# Host-driven: stage binary + this config under a unique /tmp/dcentrald_bench_t1_*/
# and run REMOTE_BIN --config REMOTE_CFG (see scripts/dcentrald_s19k_tmp_trial.sh).
# Mining stays disabled; NoPic / BM1366 / 77 chips must match the overlay.
#
# Typed [platform] identity for /tmp trials (target + board_target only — no
# safety flags). Runtime prefers /etc/dcentos/{platform,board_target} when
# present; config fills gaps. Unknown [platform] keys fail closed. CE #1 banned
# phantom kitchen-sink flags, not this typed identity section.
# Trial helper also stages /etc/dcentos/board_target=am3-s19k and
# /etc/dcentos/platform=am3-aml-s19k (authoritative when present).

[platform]
target = "am3-aml-s19k"
board_target = "am3-s19k"

[power]
mode = "bypass"
target_watts = 1400

[power.psu_override]
enabled = true
model = "APW12"
voltage_v = 14.0

[thermal]
target_temp_c = 60
hot_temp_c = 70
dangerous_temp_c = 80
fan_min_pwm = 10
fan_max_pwm = 30  # home-quiet ceiling (was 40; PWM-30 is the shipped cap)

[api]
cgminer_port = 4028
http_port = 80
websocket = true
auth_enabled = false
auth_password = ""

[donation]
enabled = false
percent = 2.0
pool_url = ""
worker = ""
password = "x"
cycle_duration_s = 3600

[watchdog]
enabled = false

[hash_on_disconnect]
enabled = true

[mode]
active = "standard"

[autotuner]
# Autotune is ON by default (operator decision 2026-09-01). The variant
# envelope guard refuses NotTunable variants (refuse, never tune blind);
# the s19k serial lane has no tuner runtime yet, so this is the config
# posture, not a tuning claim.
enabled = true
min_freq_mhz = 250
max_freq_mhz = 650

[led]
enabled = true
heartbeat_on_ms = 100
heartbeat_off_ms = 900
